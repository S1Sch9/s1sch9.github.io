name: Telegram News Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: telegram-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Process Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, re, datetime

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          admin = os.environ.get("TELEGRAM_ADMIN_ID", "").strip()
          base = "https://api.telegram.org/bot" + token

          def api(method, data=None):
              req = urllib.request.Request(
                  base + "/" + method,
                  data=json.dumps(data or {}).encode(),
                  headers={"Content-Type": "application/json"}
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  result = json.load(r)
              if not result.get("ok"):
                  raise RuntimeError(str(result))
              return result["result"]

          try:
              offset = int(open("telegram_offset.txt").read())
          except:
              offset = 0

          try:
              news = json.load(open("news.json", encoding="utf-8"))
          except:
              news = []

          updates = api("getUpdates", {
              "offset": offset,
              "timeout": 0,
              "allowed_updates": ["message"]
          })

          media_groups = {}

          for update in updates:
              offset = max(offset, update["update_id"] + 1)

              msg = update.get("message")
              if not msg:
                  continue

              chat = msg.get("chat", {})
              if chat.get("type") != "private":
                  continue

              chat_id = str(chat.get("id"))
              text = (msg.get("text") or msg.get("caption") or "").strip()


              # Everyone can start the bot; only the configured administrator can publish.
              if text.split(maxsplit=1)[0] in ["/start", "/help"]:
                  if admin and chat_id == admin:
                      welcome = (
                          "Привет! Я бот сайта Совета Первых школы №9. 💙\\n\\n"
                          "Я готов принимать новости! Отправь текст, фото или видео с подписью.\\n\\n"
                          "Команды администратора:\\n"
                          "/list — список новостей\\n"
                          "/edit ID новый текст — изменить текст новости\\n"
                          "/delete ID — удалить новость"
                      )
                  else:
                      welcome = (
                          "Привет! Я бот сайта Совета Первых школы №9. 💙\\n\\n"
                          "Я на связи и готов помочь! Публиковать, редактировать и удалять новости "
                          "может только назначенный администратор."
                      )
                  api("sendMessage", {"chat_id": chat_id, "text": welcome})
                  continue

              if not admin or chat_id != admin:
                  api("sendMessage", {
                      "chat_id": chat_id,
                      "text": "Спасибо за сообщение! 💙 Публикация новостей доступна только назначенному администратору."
                  })
                  continue

              # Download one attached photo or video into the public news media folder.
              media_item = None
              photo = msg.get("photo")
              video = msg.get("video")
              file_obj = (photo[-1] if photo else video)
              if file_obj:
                  file_info = api("getFile", {"file_id": file_obj["file_id"]})
                  file_path = file_info["file_path"]
                  ext = os.path.splitext(file_path)[1].lower() or (".mp4" if video else ".jpg")
                  if ext not in [".jpg", ".jpeg", ".png", ".webp", ".mp4", ".mov"]:
                      ext = ".mp4" if video else ".jpg"
                  media_name = str(update["update_id"]) + ext
                  os.makedirs("news-media", exist_ok=True)
                  media_url = "https://api.telegram.org/file/bot" + token + "/" + file_path
                  with urllib.request.urlopen(media_url, timeout=60) as response:
                      media_bytes = response.read()
                  if len(media_bytes) > 20 * 1024 * 1024:
                      api("sendMessage", {
                          "chat_id": chat_id,
                          "text": "Файл больше 20 МБ, поэтому я не смог прикрепить его к новости. Отправь фото или видео меньшего размера. 💙"
                      })
                      continue
                  with open(os.path.join("news-media", media_name), "wb") as media_file:
                      media_file.write(media_bytes)
                  media_item = {
                      "type": "video" if video else "image",
                      "url": "news-media/" + media_name
                  }

              if text == "/list":
                  answer = "\n".join(
                      str(n.get("id")) + " — " +
                      str(n.get("text", ""))[:100]
                      for n in news[:15]
                  ) or "Новостей пока нет."

              elif text.startswith("/delete "):
                  ident = text.split(maxsplit=1)[1].strip()
                  old = len(news)
                  news = [
                      n for n in news
                      if str(n.get("id")) != ident
                  ]
                  answer = (
                      "Новость удалена."
                      if len(news) < old else "Новость не найдена."
                  )

              elif text.startswith("/edit "):
                  parts = text.split(maxsplit=2)
                  if len(parts) < 3:
                      answer = "Формат: /edit ID новый текст"
                  else:
                      item = next(
                          (n for n in news
                           if str(n.get("id")) == parts[1]),
                          None
                      )
                      if item:
                          item["text"] = parts[2]
                          answer = "Новость изменена."
                      else:
                          answer = "Новость не найдена."

              elif (text and not text.startswith("/")) or media_item:
                  group_id = msg.get("media_group_id")
                  if group_id and media_item:
                      group = media_groups.setdefault(group_id, {
                          "text": "", "media": [], "id": "album-" + str(group_id)
                      })
                      if text:
                          group["text"] = text
                      group["media"].append(media_item)
                      answer = "Медиа добавлено в альбом новости. 💙"
                  else:
                      ident = "bot-" + str(update["update_id"])
                      news.insert(0, {
                          "id": ident,
                          "date": datetime.datetime.now(
                              datetime.timezone.utc
                          ).strftime("%Y-%m-%d"),
                          "text": text or "Новость Совета Первых школы №9",
                          "media": [media_item] if media_item else []
                      })
                      answer = "Новость опубликована на сайте! 💙 ID: " + ident

              else:
                  answer = "Неизвестная команда. Напиши /help"

              api("sendMessage", {
                  "chat_id": chat_id,
                  "text": answer
              })

          for group in media_groups.values():
              news.insert(0, {
                  "id": group["id"],
                  "date": datetime.datetime.now(
                      datetime.timezone.utc
                  ).strftime("%Y-%m-%d"),
                  "text": group["text"] or "Новость Совета Первых школы №9",
                  "media": group["media"]
              })

          news = news[:30]

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(news, f, ensure_ascii=False, indent=2)

          with open("telegram_offset.txt", "w") as f:
              f.write(str(offset))
          PY

      - name: Save news
        run: |
          git config user.name "Telegram News Bot"
          git config user.email "actions@github.com"
          git add news.json telegram_offset.txt news-media/
          git diff --cached --quiet || (
            git commit -m "Update website news" &&
            git push
          )
