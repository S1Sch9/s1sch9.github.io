name: Deploy site admin and news API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloudflare/worker.js"
      - "cloudflare/admin-page.js"
      - "cloudflare/package.json"
      - "cloudflare/validate-source.mjs"
      - "cloudflare/security-smoke-test.mjs"
      - "cloudflare/wrangler.jsonc"
      - ".github/workflows/deploy-telegram-webhook.yml"

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate source syntax
        working-directory: cloudflare
        run: |
          node --check worker.js
          node --check admin-page.js
          node validate-source.mjs
      - name: Install Worker dependencies
        working-directory: cloudflare
        run: npm install --no-package-lock --omit=dev
      - name: Run security smoke tests
        working-directory: cloudflare
        run: node security-smoke-test.mjs
      - name: Deploy Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.160.1 deploy --config wrangler.jsonc
