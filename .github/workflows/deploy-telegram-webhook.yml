name: Deploy site admin and news API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloudflare/worker.js"
      - "cloudflare/daily-holidays.js"
      - "cloudflare/social-publisher.js"
      - "cloudflare/admin-page.js"
      - "cloudflare/package.json"
      - "cloudflare/validate-source.mjs"
      - "cloudflare/security-smoke-test.mjs"
      - "cloudflare/wrangler.jsonc"
      - ".github/workflows/deploy-telegram-webhook.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate source syntax
        working-directory: cloudflare
        run: |
          node --check worker.js
          node --check daily-holidays.js
          node --check social-publisher.js
          node --check admin-page.js
          node validate-source.mjs
      - name: Install Worker dependencies
        working-directory: cloudflare
        run: npm install --no-package-lock --omit=dev
      - name: Run security smoke tests
        working-directory: cloudflare
        run: node security-smoke-test.mjs
      - name: Deploy Worker with daily bot secret
        working-directory: cloudflare
        env:
          SOVETTG_BOT_TOKEN: ${{ secrets.SOVETTG_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$SOVETTG_BOT_TOKEN"
          test -n "$TELEGRAM_ADMIN_ID"
          umask 077
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          SECRETS_FILE="$secrets_file" node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const token = String(process.env.SOVETTG_BOT_TOKEN || "").replace(/\s/g, "");
          const adminId = String(process.env.TELEGRAM_ADMIN_ID || "").replace(/\s/g, "");
          if (!token) throw new Error("Daily bot token is empty after normalization");
          if (!/^\d+$/.test(adminId)) throw new Error("TELEGRAM_ADMIN_ID must be a numeric Telegram user ID");
          writeFileSync(process.env.SECRETS_FILE, JSON.stringify({
            SOVETTG_BOT_TOKEN: token,
            TELEGRAM_ADMIN_ID: adminId
          }), { mode: 0o600 });
          NODE
          npx --yes wrangler@4.160.1 deploy --config wrangler.jsonc --secrets-file "$secrets_file"
      - name: Configure instant webhook for daily bot
        env:
          SOVETTG_BOT_TOKEN: ${{ secrets.SOVETTG_BOT_TOKEN }}
        run: |
          set -euo pipefail
          export SOVETTG_BOT_TOKEN="$(printf '%s' "$SOVETTG_BOT_TOKEN" | tr -d '[:space:]')"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          const token = process.env.SOVETTG_BOT_TOKEN;
          if (!token) throw new Error("Daily bot token is empty");
          const path = "/telegram/daily/" + createHash("sha256").update(token).digest("hex");
          const endpoint = "https://api.telegram.org/bot" + token + "/setWebhook";
          const body = new URLSearchParams({
            url: "https://still-frog-ce4c.school9ideasandsuggestions.workers.dev" + path,
            allowed_updates: JSON.stringify(["message", "callback_query"]),
            drop_pending_updates: "false"
          });
          const response = await fetch(endpoint, { method: "POST", body });
          const result = await response.json();
          if (!response.ok || !result.ok) throw new Error("Telegram setWebhook failed: " + (result.description || response.status));
          const infoResponse = await fetch("https://api.telegram.org/bot" + token + "/getWebhookInfo");
          const info = await infoResponse.json();
          if (!infoResponse.ok || !info.ok) throw new Error("Telegram getWebhookInfo failed: " + (info.description || infoResponse.status));
          const expectedPath = "/telegram/daily/" + path.split("/").pop();
          if (!info.result.url || new URL(info.result.url).pathname !== expectedPath) {
            throw new Error("Telegram webhook URL does not match the deployed Worker route.");
          }
          const workerUrl = "https://still-frog-ce4c.school9ideasandsuggestions.workers.dev" + path;
          const probe = await fetch(workerUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ update_id: Date.now() })
          });
          if (!probe.ok) throw new Error("Worker webhook route health check failed: HTTP " + probe.status);
          console.log("Daily bot webhook verified:", JSON.stringify({
            configured: Boolean(info.result.url),
            worker_route_http: probe.status,
            pending_update_count: info.result.pending_update_count || 0
          }));
          NODE