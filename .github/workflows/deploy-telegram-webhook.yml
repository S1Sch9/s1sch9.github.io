name: Deploy site admin and news API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloudflare/worker.js"
      - "cloudflare/daily-holidays.js"
      - "cloudflare/admin-page.js"
      - "cloudflare/package.json"
      - "cloudflare/validate-source.mjs"
      - "cloudflare/security-smoke-test.mjs"
      - "cloudflare/wrangler.jsonc"
      - ".github/workflows/deploy-telegram-webhook.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate source syntax
        working-directory: cloudflare
        run: |
          node --check worker.js
          node --check daily-holidays.js
          node --check admin-page.js
          node validate-source.mjs
      - name: Install Worker dependencies
        working-directory: cloudflare
        run: npm install --no-package-lock --omit=dev
      - name: Run security smoke tests
        working-directory: cloudflare
        run: node security-smoke-test.mjs
      - name: Deploy Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.160.1 deploy --config wrangler.jsonc
      - name: Export saved template for visual inspection
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.160.1 d1 execute s1sch9-appeals --remote --command "SELECT mime_type, file_name, content_base64 FROM daily_holiday_assets WHERE key = 'template';" --json > /tmp/template-query.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const data = JSON.parse(fs.readFileSync("/tmp/template-query.json", "utf8"));
          let row;
          const visit = (value) => {
            if (!value || typeof value !== "object" || row) return;
            if (typeof value.content_base64 === "string" && value.mime_type) { row = value; return; }
            for (const child of Object.values(value)) visit(child);
          };
          visit(data);
          if (!row) throw new Error("Saved template row was not found in D1 query output");
          const ext = row.mime_type === "image/png" ? "png" : row.mime_type === "image/jpeg" ? "jpg" : null;
          if (!ext) throw new Error("Unexpected template MIME type: " + row.mime_type);
          fs.mkdirSync("/tmp/template-export", { recursive: true });
          fs.writeFileSync("/tmp/template-export/original-template." + ext, Buffer.from(row.content_base64, "base64"));
          console.log("Exported saved original template; bytes:", fs.statSync("/tmp/template-export/original-template." + ext).size);
          NODE
      - name: Upload original template inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: original-template-inspection
          path: /tmp/template-export/*
          retention-days: 1
      - name: Sync separate daily Telegram bot token
        working-directory: cloudflare
        env:
          SOVETTG_BOT_TOKEN: ${{ secrets.SOVETTG_BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$SOVETTG_BOT_TOKEN"
          printf '%s' "$SOVETTG_BOT_TOKEN" | npx --yes wrangler@4.160.1 secret put SOVETTG_BOT_TOKEN --config wrangler.jsonc
      - name: Configure instant webhook for daily bot
        env:
          SOVETTG_BOT_TOKEN: ${{ secrets.SOVETTG_BOT_TOKEN }}
        run: |
          set -euo pipefail
          export SOVETTG_BOT_TOKEN="$(printf '%s' "$SOVETTG_BOT_TOKEN" | tr -d '[:space:]')"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          const token = process.env.SOVETTG_BOT_TOKEN;
          if (!token) throw new Error("Daily bot token is empty");
          const path = "/telegram/daily/" + createHash("sha256").update(token).digest("hex");
          const endpoint = "https://api.telegram.org/bot" + token + "/setWebhook";
          const body = new URLSearchParams({
            url: "https://still-frog-ce4c.school9ideasandsuggestions.workers.dev" + path,
            allowed_updates: JSON.stringify(["message", "callback_query"]),
            drop_pending_updates: "false"
          });
          const response = await fetch(endpoint, { method: "POST", body });
          const result = await response.json();
          if (!response.ok || !result.ok) throw new Error("Telegram setWebhook failed: " + (result.description || response.status));
          console.log("Daily bot webhook configured:", result.result.url);
          NODE