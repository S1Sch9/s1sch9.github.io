function render(){let liked=tracks.filter(t=>likes.has(t.id)),recent=history.map(id=>tracks.find(t=>t.id===id)).filter(Boolean).slice(0,5);$('#liblist').innerHTML=playlists.map((p,i)=>'<div class="libitem" data-pl="'+i+'"><div class="libcover">♫</div><div class="libmeta"><strong>'+esc(p.name)+'</strong><small>Плейлист · '+p.ids.length+' треков</small></div></div>').join('')+(liked.length?'<div class="libitem" data-view="liked"><div class="libcover" style="background:linear-gradient(135deg,#593a9a,#19234a)">♥</div><div class="libmeta"><strong>Любимые треки</strong><small>Плейлист · '+liked.length+' треков</small></div></div>':'');$('#quick').innerHTML=[{name:'Любимые треки',icon:'♥',n:liked.length,view:'liked'},{name:'Недавно прослушанное',icon:'◷',n:recent.length,view:'history'},...playlists.slice(0,4).map((p,i)=>({name:p.name,icon:'♫',n:p.ids.length,pl:i}))].map(x=>'<button class="quick" '+(x.view?'data-view="'+x.view+'"':'data-pl="'+x.pl+'"')+'><span class="qcover">'+x.icon+'</span><span>'+esc(x.name)+'</span><span class="playdot">▶</span></button>').join('');$('#recent').innerHTML=recent.length?recent.map(t=>album(t)).join(''):'<div class="empty">Здесь появятся твои прослушивания.</div>';$('#playlists').innerHTML=playlists.length?playlists.map((p,i)=>'<article class="album" data-pl="'+i+'"><div class="art">♫<button class="artplay">▶</button></div><strong>'+esc(p.name)+'</strong><small>Плейлист · '+p.ids.length+' треков</small></article>').join(''):'<div class="empty">Создай свой первый плейлист.</div>';showTracks(tracks);$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}

function showTracks(list){if(!list.length){$('#tracks').innerHTML='<div class="empty">Добавь аудиофайлы или импортируй список Spotify.</div>';return}$('#tracks').innerHTML='<table class="tracks"><thead><tr><th>#</th><th>Название</th><th>Альбом</th><th>♡</th><th>Время</th></tr></thead><tbody>'+list.map(t=>'<tr><td>'+ (tracks.indexOf(t)+1)+'</td><td><div class="trackname" data-play="'+tracks.indexOf(t)+'"><div class="trackart">'+art(t)+'</div><span><b>'+esc(t.title)+'</b><small>'+esc(t.artist||'Неизвестный исполнитель')+(t.missing?' · Не найдено':'')+'</small></span></div></td><td>'+esc(t.album||'—')+'</td><td><button class="like '+(likes.has(t.id)?'on':'')+'" data-like="'+t.id+'">'+(likes.has(t.id)?'♥':'♡')+'</button></td><td class="duration">'+(t.duration?fmt(t.duration):'—')+'</td></tr>').join('')+'</tbody></table>'}
function pageView(v){view=v;let list=v==='liked'?tracks.filter(t=>likes.has(t.id)):v==='history'?history.map(id=>tracks.find(t=>t.id===id)).filter(Boolean):tracks;let title={home:'Добрый вечер',search:'Поиск',library:'Твоя медиатека',liked:'Любимые треки',history:'Недавно прослушанное'}[v]||'Твоя музыка';if(v==='home'){render();return}$('#page').innerHTML='<section class="section"><div class="secthead"><h2>'+title+'</h2><button id="uploadInline">Добавить музыку</button></div><div id="viewTracks"></div></section>';let table=$('#viewTracks');table.innerHTML=list.length?'<table class="tracks"><thead><tr><th>#</th><th>Название</th><th>Альбом</th><th>♡</th><th>Время</th></tr></thead><tbody>'+list.map(t=>'<tr><td>'+(tracks.indexOf(t)+1)+'</td><td><div class="trackname" data-play="'+tracks.indexOf(t)+'"><div class="trackart">'+art(t)+'</div><span><b>'+esc(t.title)+'</b><small>'+esc(t.artist||'Неизвестный исполнитель')+(t.missing?' · Не найдено':'')+'</small></span></div></td><td>'+esc(t.album||'—')+'</td><td><button class="like '+(likes.has(t.id)?'on':'')+'" data-like="'+t.id+'">'+(likes.has(t.id)?'♥':'♡')+'</button></td><td class="duration">'+(t.duration?fmt(t.duration):'—')+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">Пока здесь пусто.</div>';$('#uploadInline').onclick=()=>$('#files').click();$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}
async function play(i){let t=tracks[i];if(!t)return;if(!t.fileId){toast('Для этой записи пока нет аудиофайла');return}let item=await req('files','readonly',s=>s.get(t.fileId));if(!item){toast('Файл не найден');return}current=i;audio.src=URL.createObjectURL(item.blob);audio.play().catch(()=>{});$('#nowtitle').textContent=t.title;$('#nowartist').textContent=t.artist||'Неизвестный исполнитель';$('#nowart').innerHTML=art(t);$('#toggle').textContent='Ⅱ';$('#nowlike').textContent=likes.has(t.id)?'♥':'♡';history=[t.id,...history.filter(x=>x!==t.id)].slice(0,50);save();render()}
function next(){let i=current+1;if(shuffle){let a=tracks.map((t,i)=>t.fileId?i:-1).filter(i=>i>=0);i=a[Math.floor(Math.random()*a.length)]}else while(i<tracks.length&&!tracks[i].fileId)i++;if(i>=0&&i<tracks.length)play(i);else if(repeat&&current>=0)play(current);else $('#toggle').textContent='▶'}
function toggle(){if(!audio.src){let i=tracks.findIndex(t=>t.fileId);if(i>=0)play(i);else toast('Добавь аудиофайл для воспроизведения');return}if(audio.paused){audio.play();$('#toggle').textContent='Ⅱ'}else{audio.pause();$('#toggle').textContent='▶'}}

function importSpotify(f){let r=new FileReader();r.onload=()=>{let rows=[];try{if(f.name.endsWith('.json')){let j=JSON.parse(r.result);rows=Array.isArray(j)?j:[]}else{let lines=String(r.result).split(/\r?\n/),h=lines.shift().split(',').map(x=>x.replace(/^"|"$/g,''));rows=lines.filter(Boolean).map(line=>{let a=line.split(',').map(x=>x.replace(/^"|"$/g,''));return Object.fromEntries(h.map((k,i)=>[k,a[i]||'']))})}}catch(e){toast('Не удалось прочитать файл');return}let n=0;for(let x of rows){let title=x.trackName||x['Track Name']||x.title||x.name,artist=x.artistName||x['Artist Name(s)']||x.artist;if(!title)continue;let id='spotify-'+(x.trackUri||x['Track URI']||title+artist);if(!tracks.some(t=>t.id===id)){tracks.push({id,title,artist:artist||'Неизвестный исполнитель',album:x.albumName||x['Album Name']||'',missing:true});n++}}save();render();toast('Добавлено записей: '+n+'. Аудио импорт не включает.')} ;r.readAsText(f)}
document.addEventListener('click',e=>{let b=e.target.closest('button,[data-play],[data-pl],[data-view]');if(!b)return;if(b.dataset.view)pageView(b.dataset.view);if(b.dataset.play!==undefined)play(+b.dataset.play);if(b.dataset.pl!==undefined){let p=playlists[+b.dataset.pl];if(!p)return;let list=p.ids.map(id=>tracks.find(t=>t.id===id)).filter(Boolean);$('#page').innerHTML='<h1 class="greeting">'+esc(p.name)+'</h1>';let temp=document.createElement('div');$('#page').append(temp);showTracksInto(temp,list)}if(b.dataset.like){likes.has(b.dataset.like)?likes.delete(b.dataset.like):likes.add(b.dataset.like);save();render();if(view!=='home')pageView(view)}});
function showTracksInto(el,list){el.innerHTML=list.length?'<table class="tracks"><tbody>'+list.map(t=>'<tr><td>'+(tracks.indexOf(t)+1)+'</td><td><div class="trackname" data-play="'+tracks.indexOf(t)+'"><div class="trackart">'+art(t)+'</div><span><b>'+esc(t.title)+'</b><small>'+esc(t.artist)+'</small></span></div></td><td><button class="like" data-like="'+t.id+'">♡</button></td></tr>').join('')+'</tbody></table>':'<div class="empty">Плейлист пока пуст.</div>'}
$('#newpl').onclick=$('#create').onclick=newPlaylist;$('#upload').onclick=()=>$('#files').click();$('#files').onchange=async e=>{for(let f of e.target.files){let id=crypto.randomUUID();await req('files','readwrite',s=>s.put({id,blob:f}));tracks.push({id,title:f.name.replace(/\.[^.]+$/,''),artist:'Локальный файл',album:'Моя музыка',fileId:id})}save();render();toast('Музыка добавлена')};$('#sync').onclick=()=>{$('#spotify').click()};$('#spotify').onchange=e=>{if(e.target.files[0])importSpotify(e.target.files[0])};$('#toggle').onclick=toggle;$('#next').onclick=next;$('#prev').onclick=()=>{if(audio.currentTime>3)audio.currentTime=0;else{let i=current-1;while(i>=0&&!tracks[i].fileId)i--;if(i>=0)play(i)}};$('#shuffle').onclick=()=>{shuffle=!shuffle;$('#shuffle').classList.toggle('green',shuffle)};$('#repeat').onclick=()=>{repeat=!repeat;$('#repeat').classList.toggle('green',repeat)};$('#nowlike').onclick=()=>{if(current>=0){let id=tracks[current].id;likes.has(id)?likes.delete(id):likes.add(id);save();render();$('#nowlike').textContent=likes.has(id)?'♥':'♡'}};$('#seek').oninput=e=>{if(audio.duration)audio.currentTime=audio.duration*e.target.value/100};$('#volume').oninput=e=>audio.volume=+e.target.value;audio.volume=.8;audio.ontimeupdate=()=>{if(audio.duration){$('#seek').value=audio.currentTime/audio.duration*100;$('#elapsed').textContent=fmt(audio.currentTime);$('#duration').textContent=fmt(audio.duration)}};audio.onended=()=>repeat&&current>=0?play(current):next();$('#search').oninput=e=>{let q=e.target.value.toLowerCase();view='search';let list=tracks.filter(t=>(t.title+' '+t.artist+' '+t.album).toLowerCase().includes(q));$('#page').innerHTML='<section class="section"><div class="secthead"><h2>Результаты поиска</h2></div><div id="results"></div></section>';showTracksInto($('#results'),list)};$$('[data-view]').forEach(b=>b.onclick=()=>pageView(b.dataset.view));$('#back').onclick=()=>pageView('home');$('#forward').onclick=()=>pageView('library');
(async()=>{try{await initDB();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){toast('Не удалось открыть локальное хранилище')}})();

/* Interaction and library improvements */
const originalRender=render;
function render(){
 const liked=tracks.filter(t=>likes.has(t.id));
 const recent=history.map(id=>tracks.find(t=>t.id===id)).filter(Boolean).slice(0,5);
 $('#liblist').innerHTML=playlists.map((p,i)=>'<div class="libitem" data-pl="'+i+'"><div class="libcover">♫</div><div class="libmeta"><strong>'+esc(p.name)+'</strong><small>Плейлист · '+p.ids.length+' треков</small></div></div>').join('')+(liked.length?'<div class="libitem" data-view="liked"><div class="libcover">♥</div><div class="libmeta"><strong>Любимые треки</strong><small>Плейлист · '+liked.length+' треков</small></div></div>':'');
 $('#quick').innerHTML=[{name:'Любимые треки',icon:'♥',n:liked.length,view:'liked'},{name:'Недавно прослушанное',icon:'◷',n:recent.length,view:'history'},...playlists.slice(0,4).map((p,i)=>({name:p.name,icon:'♫',n:p.ids.length,pl:i}))].map(x=>'<button class="quick" '+(x.view?'data-view="'+x.view+'"':'data-pl="'+x.pl+'"')+'><span class="qcover">'+x.icon+'</span><span>'+esc(x.name)+'</span><span class="playdot">▶</span></button>').join('');
 $('#recent').innerHTML=recent.length?recent.map(t=>album(t)).join(''):'<div class="empty">Твои прослушивания появятся здесь.</div>';
 $('#playlists').innerHTML=playlists.length?playlists.map((p,i)=>'<article class="album" data-pl="'+i+'"><div class="art">♫<button class="artplay">▶</button></div><strong>'+esc(p.name)+'</strong><small>Плейлист · '+p.ids.length+' треков</small></article>').join(''):'<div class="empty">Создай первый плейлист — собери музыку под своё настроение.</div>';
 showTracks(tracks);
 $('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
}
function trackRows(list){
 if(!list.length)return '<div class="empty">Здесь пока пусто. Добавь музыку с устройства или импортируй свою библиотеку.</div>';
 return '<table class="tracks"><thead><tr><th>#</th><th>Название</th><th>Альбом</th><th>♡</th><th>Время</th><th></th></tr></thead><tbody>'+list.map(t=>'<tr><td>'+(tracks.indexOf(t)+1)+'</td><td><div class="trackname" data-play="'+tracks.indexOf(t)+'"><div class="trackart">'+art(t)+'</div><span><b>'+esc(t.title)+'</b><small>'+esc(t.artist||'Неизвестный исполнитель')+(t.missing?' · Только информация':'')+'</small></span></div></td><td>'+esc(t.album||'—')+'</td><td><button class="like '+(likes.has(t.id)?'on':'')+'" data-like="'+t.id+'">'+(likes.has(t.id)?'♥':'♡')+'</button></td><td class="duration">'+(t.duration?fmt(t.duration):'—')+'</td><td><button class="like" data-addtrack="'+t.id+'" title="Добавить в плейлист">＋</button></td></tr>').join('')+'</tbody></table>';
}

function pageView(v){
 view=v;
 const list=v==='liked'?tracks.filter(t=>likes.has(t.id)):v==='history'?history.map(id=>tracks.find(t=>t.id===id)).filter(Boolean):tracks;
 const title={home:'Добрый вечер',search:'Поиск',library:'Твоя медиатека',liked:'Любимые треки',history:'Недавно прослушанное'}[v]||'Твоя музыка';
 if(v==='home'){render();return}
 $('#page').innerHTML='<section class="section"><div class="secthead"><h2>'+title+'</h2><button id="uploadInline">＋ Добавить музыку</button></div><div id="viewTracks">'+trackRows(list)+'</div></section>';
 $('#uploadInline').onclick=()=>$('#files').click();
 $('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
 $('#page').classList.remove('animate-in');void $('#page').offsetWidth;$('#page').classList.add('animate-in');
}
function addToPlaylist(id){
 const track=tracks.find(t=>t.id===id);if(!track)return;
 if(!playlists.length){newPlaylist();return}
 const choices=playlists.map((p,i)=>'<button class="libitem" style="width:100%;background:#252530;margin:6px 0;text-align:left" data-choosepl="'+i+'"><span class="libcover">♫</span><span class="libmeta"><strong>'+esc(p.name)+'</strong><small>'+p.ids.length+' треков</small></span></button>').join('');
 $('#modal').innerHTML='<div class="modalbg"><div class="modal"><h2>Добавить в плейлист</h2><p>'+esc(track.title)+'</p>'+choices+'<div class="modalactions"><button class="cancel" id="cancel">Закрыть</button></div></div></div>';
 $('#cancel').onclick=()=>$('#modal').innerHTML='';
 $('[data-choosepl]').forEach(b=>b.onclick=()=>{const p=playlists[+b.dataset.choosepl];if(!p.ids.includes(id))p.ids.push(id);save();$('#modal').innerHTML='';render();toast('Добавлено в «'+p.name+'»')});
}
function playlistPage(i){

 const list=p.ids.map(id=>tracks.find(t=>t.id===id)).filter(Boolean);
 $('#page').innerHTML='<section class="section"><div class="secthead"><h2>'+esc(p.name)+'</h2><div><button id="addToThis">＋ Добавить треки</button><button id="renameThis">Переименовать</button><button id="deleteThis">Удалить</button></div></div><div id="playlistTracks">'+trackRows(list)+'</div></section>';
 $('#addToThis').onclick=()=>{const available=tracks.filter(t=>!p.ids.includes(t.id));if(!available.length){toast('В медиатеке пока нет новых треков');return}$('#modal').innerHTML='<div class="modalbg"><div class="modal"><h2>Добавить музыку</h2><p>Выбери композиции для плейлиста</p>'+available.map(t=>'<button class="libitem" style="width:100%;text-align:left" data-picktrack="'+t.id+'"><span class="libcover">♫</span><span class="libmeta"><strong>'+esc(t.title)+'</strong><small>'+esc(t.artist||'Исполнитель не указан')+'</small></span></button>').join('')+'<div class="modalactions"><button class="cancel" id="cancel">Готово</button></div></div></div>';$('#cancel').onclick=()=>{$('#modal').innerHTML='';playlistPage(i)};$('[data-picktrack]').forEach(b=>b.onclick=()=>{p.ids.push(b.dataset.picktrack);save();b.remove();toast('Трек добавлен')})};
 $('#renameThis').onclick=()=>modal('Переименовать плейлист','Введи новое название.','<input id="plname" value="'+esc(p.name)+'" maxlength="50">','Сохранить',()=>{const n=$('#plname').value.trim();if(!n)return;p.name=n;save();$('#modal').innerHTML='';playlistPage(i);render();toast('Название изменено')});
 $('#deleteThis').onclick=()=>modal('Удалить плейлист?','Сами аудиофайлы останутся в медиатеке.','', 'Удалить',()=>{playlists.splice(i,1);save();$('#modal').innerHTML='';pageView('library');render();toast('Плейлист удалён')});
 $('#page').classList.add('animate-in');
}
function play(i){
 const t=tracks[i];if(!t)return;
 if(!t.fileId){toast('У этой записи нет аудиофайла. Добавь сам файл с устройства.');return}
 req('files','readonly',s=>s.get(t.fileId)).then(item=>{
  if(!item){toast('Аудиофайл не найден');return}
  if(audio.dataset.objectUrl)URL.revokeObjectURL(audio.dataset.objectUrl);
  current=i;const url=URL.createObjectURL(item.blob);audio.dataset.objectUrl=url;audio.src=url;
  audio.play().then(()=>{$('#toggle').textContent='Ⅱ'}).catch(()=>toast('Не удалось запустить воспроизведение'));
  $('#nowtitle').textContent=t.title;$('#nowartist').textContent=t.artist||'Неизвестный исполнитель';$('#nowart').innerHTML=art(t);$('#nowlike').textContent=likes.has(t.id)?'♥':'♡';
  history=[t.id,...history.filter(x=>x!==t.id)].slice(0,50);save();render();
 }).catch(()=>toast('Не удалось открыть аудиофайл'));
}
function parseCSV(text){
 const rows=[];let row=[],cell='',quoted=false;
 for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'&&quoted&&text[i+1]==='"'){cell+='"';i++}else if(c==='"'){quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}
 row.push(cell);if(row.some(x=>x.trim()))rows.push(row);if(!rows.length)return [];
 const headers=rows.shift().map(x=>x.trim());return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]||'').trim()])));
}
function importSpotify(f){
 const reader=new FileReader();reader.onload=()=>{
  try{
   let rows;if(f.name.toLowerCase().endsWith('.json')){const j=JSON.parse(reader.result);rows=Array.isArray(j)?j:(j.items||j.tracks||[])}else rows=parseCSV(String(reader.result));
   let added=0;for(const x of rows){const title=x.trackName||x['Track Name']||x.track_name||x.title||x.name;const artist=x.artistName||x['Artist Name(s)']||x.artist_name||x.artist;if(!title)continue;
    const id='spotify-'+(x.trackUri||x['Track URI']||x.uri||title+'-'+artist);if(!tracks.some(t=>t.id===id)){tracks.push({id,title,artist:artist||'Неизвестный исполнитель',album:x.albumName||x['Album Name']||x.album_name||x.album||'',missing:true,spotifyUri:x.trackUri||x['Track URI']||x.uri||''});added++}
   }save();render();toast('Импортировано записей: '+added+'. Для воспроизведения нужны аудиофайлы.');f.value='';
  }catch(e){toast('Не удалось прочитать файл Spotify')}
 };reader.readAsText(f);
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button,[data-play],[data-pl],[data-view]');if(!b)return;
 if(b.dataset.view){e.preventDefault();pageView(b.dataset.view);return}
 if(b.dataset.play!==undefined){e.preventDefault();play(+b.dataset.play);return}
 if(b.dataset.pl!==undefined){e.preventDefault();playlistPage(+b.dataset.pl);return}
 if(b.dataset.like){e.preventDefault();likes.has(b.dataset.like)?likes.delete(b.dataset.like):likes.add(b.dataset.like);save();render();if(view!=='home')pageView(view);return}
 if(b.dataset.addtrack){e.preventDefault();addToPlaylist(b.dataset.addtrack);return}
},{capture:true});
$('[data-view]').forEach(b=>b.onclick=null);
$('#newpl').onclick=$('#create').onclick=newPlaylist;
$('#upload').onclick=()=>$('#files').click();
$('#files').onchange=async e=>{
 const files=[...e.target.files];if(!files.length)return;
 let added=0;
 for(const f of files){if(!f.type.startsWith('audio/'))continue;const id=crypto.randomUUID();await req('files','readwrite',s=>s.put({id,blob:f}));const t={id,title:f.name.replace(/\.[^.]+$/,''),artist:'Локальный файл',album:'Моя музыка',fileId:id};tracks.push(t);added++}
 save();render();toast(added?'Добавлено файлов: '+added:'Не найдено аудиофайлов');e.target.value='';
};
$('#sync').onclick=()=>$('#spotify').click();$('#spotify').onchange=e=>{if(e.target.files[0])importSpotify(e.target.files[0])};
$('#toggle').onclick=toggle;$('#next').onclick=next;
$('#prev').onclick=()=>{if(audio.currentTime>3)audio.currentTime=0;else{let i=current-1;while(i>=0&&!tracks[i].fileId)i--;if(i>=0)play(i)}};
$('#shuffle').onclick=()=>{shuffle=!shuffle;$('#shuffle').classList.toggle('green',shuffle);toast(shuffle?'Перемешивание включено':'Перемешивание выключено')};
$('#repeat').onclick=()=>{repeat=!repeat;$('#repeat').classList.toggle('green',repeat);toast(repeat?'Повтор включён':'Повтор выключен')};
$('#nowlike').onclick=()=>{if(current>=0){const id=tracks[current].id;likes.has(id)?likes.delete(id):likes.add(id);save();render();$('#nowlike').textContent=likes.has(id)?'♥':'♡'}};
$('#seek').oninput=e=>{if(audio.duration)audio.currentTime=audio.duration*e.target.value/100};
$('#volume').oninput=e=>audio.volume=+e.target.value;audio.volume=.8;
audio.ontimeupdate=()=>{if(audio.duration){$('#seek').value=audio.currentTime/audio.duration*100;$('#elapsed').textContent=fmt(audio.currentTime);$('#duration').textContent=fmt(audio.duration)}};
audio.onended=()=>repeat&&current>=0?play(current):next();
$('#search').oninput=e=>{const q=e.target.value.trim().toLowerCase();view='search';const list=tracks.filter(t=>(t.title+' '+t.artist+' '+t.album).toLowerCase().includes(q));$('#page').innerHTML='<section class="section"><div class="secthead"><h2>Результаты поиска</h2></div><div id="results">'+trackRows(list)+'</div></section>';$('#page').classList.add('animate-in')};
$('#back').onclick=()=>pageView('home');$('#forward').onclick=()=>pageView('library');

</script></body></html>
